<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<title>Nishikesh Bhagat · AR Visiting Card</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#05070d;
  --bg2:#0a0f1c;
  --ink:#eaf2ff;
  --muted:#8b97b3;
  --accent:#63d3ff;
  --accent2:#8a7bff;
  --glass:rgba(18,24,40,.55);
  --glass-brd:rgba(140,170,220,.18);
  --glass-hi:rgba(255,255,255,.06);
  --shadow:0 18px 60px rgba(0,0,0,.55);
  --r:18px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;
  position:fixed;
  inset:0;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ============================================================
   BACKGROUND LAYERS
   #arContainer   → REAL mode: MindAR injects its own <video> (camera) +
                     WebGL <canvas> here. This is the only place real
                     camera pixels ever get shown.
   #demoBg/#scene → DEMO mode: a synthetic backdrop + our own Three.js
                     canvas, driven by a simulated timer. Never used at
                     the same time as #arContainer.
   ============================================================ */
#arContainer{position:absolute;inset:0;width:100%;height:100%;z-index:1;background:#000;overflow:hidden;}
#arContainer video{object-fit:cover;}
#scene{position:absolute;inset:0;width:100%;height:100%;z-index:2;}
#demoBg{
  position:absolute;inset:0;width:100%;height:100%;z-index:0;
  opacity:0;transition:opacity .6s ease;
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(99,211,255,.10), transparent 55%),
    radial-gradient(120% 90% at 80% 100%, rgba(138,123,255,.12), transparent 55%),
    radial-gradient(100% 100% at 20% 90%, rgba(20,30,60,.6), transparent 60%),
    linear-gradient(180deg,#070b16 0%,#05070d 60%,#04060c 100%);
}
#demoBg.on{opacity:1;}
#demoBg::after{ /* faint floor grid to sell depth */
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(120,160,220,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,160,220,.05) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(120% 70% at 50% 118%,#000,transparent 62%);
          mask-image:radial-gradient(120% 70% at 50% 118%,#000,transparent 62%);
  transform:perspective(600px) rotateX(66deg);
  transform-origin:bottom;opacity:.8;
}

/* ============================================================
   OVERLAY (all UI floats above the scene)
   ============================================================ */
#overlay{position:absolute;inset:0;z-index:5;pointer-events:none;}
#overlay > *{pointer-events:auto;}

/* Vignette for premium depth — sits above both real + demo scenes */
#vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%);}

/* ---------- Eyebrow / label type ---------- */
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);
  font-weight:600;opacity:.9;}

/* ============================================================
   START SCREEN
   ============================================================ */
#start{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 26px calc(38px + var(--safe-b));gap:22px;
  background:
    radial-gradient(90% 60% at 50% 22%,rgba(99,211,255,.10),transparent 60%),
    linear-gradient(180deg,rgba(5,7,13,.72),rgba(5,7,13,.92));
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  transition:opacity .5s ease,transform .5s ease;
}
#start.hide{opacity:0;transform:scale(1.04);pointer-events:none;}
.mark{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;margin-bottom:4px;
  background:linear-gradient(160deg,rgba(99,211,255,.22),rgba(138,123,255,.16));
  border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);}
.mark svg{width:38px;height:38px;color:var(--accent);}
#start h1{
  font-size:clamp(28px,7.6vw,40px);line-height:1.05;margin:6px 0 0;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(180deg,#ffffff,#bcd4f2);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.intro-role{color:var(--ink);font-size:16px;font-weight:600;letter-spacing:.01em;margin:2px 0 0;opacity:.92;}
.intro-tagline{color:var(--muted);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin:2px 0 0;}
#start p.sub{color:var(--muted);font-size:15px;max-width:22rem;line-height:1.5;margin:12px 0 0;}
.cta-wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin-top:6px;}
.btn{
  border:1px solid var(--glass-brd);border-radius:16px;font-size:15px;font-weight:600;
  padding:15px 20px;cursor:pointer;color:var(--ink);letter-spacing:.01em;
  transition:transform .12s ease,box-shadow .2s ease,background .2s ease;
}
.btn:active{transform:scale(.97);}
.btn-ghost{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);}
.hint{color:var(--muted);font-size:12px;opacity:.75;margin-top:2px;}
.btn-textlink{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;padding:8px 12px;}
.btn-textlink:active{opacity:.6;}

/* ---------- AR intro hero (the mini scanning-frame on the start screen) ---------- */
.mini-reticle{position:relative;width:150px;aspect-ratio:1.62/1;margin:0 auto 4px;}
.mini-reticle .mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;}
.intro-sparks{position:absolute;inset:-34px;pointer-events:none;}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px 2px var(--accent);opacity:0;animation:sparkle 2.6s ease-in-out infinite;}
.spark:nth-child(2){top:70%;left:92%;animation-delay:.6s;background:var(--accent2);box-shadow:0 0 8px 2px var(--accent2);}
.spark:nth-child(3){top:88%;left:10%;animation-delay:1.1s;}
.spark:nth-child(4){top:4%;left:88%;animation-delay:1.6s;background:var(--accent2);box-shadow:0 0 8px 2px var(--accent2);}
.spark:nth-child(1){top:8%;left:4%;}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}

/* ============================================================
   SCANNING UI
   ============================================================ */
#scan{position:absolute;inset:0;display:none;place-items:center;}
#scan.on{display:grid;}
.reticle{position:relative;width:min(74vw,340px);aspect-ratio:1.62/1;}
.corner{position:absolute;width:34px;height:34px;border:2.5px solid var(--accent);opacity:.9;
  filter:drop-shadow(0 0 6px rgba(99,211,255,.5));}
.corner.tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:10px;}
.corner.tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:10px;}
.corner.bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:10px;}
.corner.br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:10px;}
.scanline{position:absolute;left:8px;right:8px;height:2px;top:8px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  box-shadow:0 0 16px 2px rgba(99,211,255,.55);
  animation:scanline 2.1s cubic-bezier(.5,0,.5,1) infinite;}
@keyframes scanline{0%{top:8px}50%{top:calc(100% - 10px)}100%{top:8px}}
.detected .scanline,.detected .corner{opacity:0;transition:opacity .3s;}
#detectRing{position:absolute;inset:-2px;border:2px solid var(--accent);border-radius:14px;opacity:0;
  box-shadow:0 0 0 rgba(99,211,255,.6);}
.detected #detectRing{animation:detectPulse .8s ease-out forwards;}
@keyframes detectPulse{
  0%{opacity:0;transform:scale(.96)}
  25%{opacity:1}
  100%{opacity:0;transform:scale(1.12);box-shadow:0 0 44px rgba(99,211,255,.0)}
}

/* ============================================================
   STATUS PILL (top) + DEMO badge
   ============================================================ */
#status{
  position:absolute;top:calc(18px + var(--safe-t));left:50%;transform:translateX(-50%);
  display:none;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:13px;letter-spacing:.02em;color:var(--ink);box-shadow:var(--shadow);white-space:nowrap;
}
#status.on{display:flex;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.dot.searching{animation:blinkdot 1s ease-in-out infinite;}
.dot.ok{background:#4ade80;box-shadow:0 0 10px #4ade80;}
.dot.lost{background:#ff6b6b;box-shadow:0 0 10px #ff6b6b;animation:blinkdot 1s ease-in-out infinite;}
@keyframes blinkdot{0%,100%{opacity:1}50%{opacity:.25}}

#demoBanner{
  position:absolute;top:calc(60px + var(--safe-t));left:50%;transform:translateX(-50%);
  display:none;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
  background:rgba(255,180,60,.14);border:1px solid rgba(255,180,60,.4);color:#ffc76b;
  font-size:11px;font-weight:700;letter-spacing:.08em;white-space:nowrap;
}
#demoBanner.on{display:flex;}

/* ============================================================
   FLOATING SOCIAL BUTTONS (orbit the character)
   ============================================================ */
#buttons{position:absolute;inset:0;pointer-events:none;}
.ar-btn{
  position:absolute;left:0;top:0;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  border:0;background:transparent;padding:0;cursor:pointer;color:var(--ink);
  opacity:0;will-change:transform;
}
.ar-btn.live{opacity:1;pointer-events:auto;}
.ar-btn__f{display:flex;flex-direction:column;align-items:center;gap:7px;} /* float layer */
.ar-btn__p{display:grid;place-items:center;transform:scale(1);}            /* entrance-scale layer */
.ar-btn.in .ar-btn__p{animation:pop .55s cubic-bezier(.2,1.3,.4,1) both;}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
.ar-btn.in .ar-btn__f{animation:floaty 4.2s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.orb{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:var(--glass);border:1px solid var(--glass-brd);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);overflow:hidden;
  transition:transform .12s ease;                                          /* tap-press layer */
}
.ar-btn:active .orb{transform:scale(.86);}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(80% 80% at 50% 15%,var(--bc,rgba(99,211,255,.35)),transparent 70%);opacity:.9;}
.orb svg{width:26px;height:26px;position:relative;z-index:1;color:var(--bc,var(--accent));
  filter:drop-shadow(0 0 6px rgba(0,0,0,.4));}
.ar-btn .lab{font-size:11px;letter-spacing:.03em;color:var(--ink);opacity:.9;
  background:rgba(6,10,20,.5);padding:2px 9px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.ripple{position:absolute;border-radius:50%;background:var(--bc,var(--accent));opacity:.5;
  transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:2;
  animation:ripple .55s ease-out forwards;}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(4);opacity:0}}

/* ============================================================
   BOTTOM HUD (identity chip + scan again)
   ============================================================ */
#hud{
  position:absolute;left:0;right:0;bottom:calc(18px + var(--safe-b));
  display:none;align-items:center;justify-content:center;gap:12px;padding:0 16px;flex-wrap:wrap;
}
#hud.on{display:flex;animation:fadeUp .5s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.idchip{
  display:flex;align-items:center;gap:11px;padding:8px 8px 8px 8px;border-radius:16px;
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--shadow);max-width:78vw;
}
.avatar{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,var(--accent),var(--accent2));color:#04121c;font-weight:800;font-size:16px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.idchip .who{display:flex;flex-direction:column;line-height:1.15;padding-right:6px;min-width:0;}
.idchip .who b{font-size:14px;font-weight:700;}
.idchip .who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#again{
  display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:16px;cursor:pointer;
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--ink);font-size:14px;font-weight:600;box-shadow:var(--shadow);transition:transform .12s;
}
#again:active{transform:scale(.96);}
#again svg{width:17px;height:17px;color:var(--accent);}

/* ============================================================
   DEBUG PANEL
   ============================================================ */
#debugToggle{
  position:absolute;top:calc(14px + var(--safe-t));right:14px;width:34px;height:34px;border-radius:10px;
  background:rgba(10,14,24,.5);border:1px solid var(--glass-brd);backdrop-filter:blur(10px);
  display:grid;place-items:center;cursor:pointer;opacity:.55;color:var(--muted);font-size:15px;
  transition:opacity .15s;
}
#debugToggle:active{opacity:1;}
#debugPanel{
  position:absolute;top:calc(56px + var(--safe-t));right:14px;display:none;
  background:rgba(6,10,18,.78);border:1px solid var(--glass-brd);border-radius:10px;
  padding:10px 12px;font:11px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#9be29b;
  white-space:pre;backdrop-filter:blur(10px);max-width:58vw;box-shadow:var(--shadow);
}
#debugPanel.on{display:block;}

/* ============================================================
   TOAST + FATAL
   ============================================================ */
#toast{position:absolute;bottom:calc(96px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:11px 16px;border-radius:12px;font-size:13px;color:var(--ink);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:84vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#fatal{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:20;
  background:linear-gradient(180deg,rgba(5,7,13,.9),rgba(5,7,13,.98));}
#fatal.on{display:grid;}
#fatal .box{max-width:340px;display:flex;flex-direction:column;align-items:center;gap:6px;}
#fatal h2{font-size:20px;margin:0 0 8px;}
#fatal p{color:var(--muted);font-size:14px;line-height:1.5;margin:0;}
#fatal .cta-wrap{margin-top:14px;}
#fatalDemoBtn{display:none;}
#fatalDemoBtn.on{display:inline-flex;}

/* ============================================================
   LOW-TIER DEVICE FALLBACK
   Set by DeviceTier.detect() on <html> — swaps every backdrop-filter glass
   panel for a flat, more-opaque background instead. Same layout/contrast,
   just without the per-frame compositor blur cost. See DeviceTier's comment.
   ============================================================ */
.perf-low #start,.perf-low .btn-ghost,.perf-low #status,.perf-low .orb,
.perf-low .lab,.perf-low .idchip,.perf-low #again,.perf-low #debugToggle,
.perf-low #debugPanel,.perf-low #toast{
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
.perf-low #start{background:linear-gradient(180deg,rgba(5,7,13,.94),rgba(5,7,13,.98));}
.perf-low .btn-ghost,.perf-low #status,.perf-low .orb,.perf-low .idchip,.perf-low #again{
  background:rgba(14,19,32,.86);
}
.perf-low .lab{background:rgba(6,10,20,.82);}
.perf-low #debugToggle{background:rgba(10,14,24,.82);}
.perf-low #debugPanel{background:rgba(6,10,18,.92);}
.perf-low #toast{background:rgba(14,19,32,.9);}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  .scanline{animation:none;top:50%;}
  .ar-btn.in .ar-btn__f{animation:none;}
  .ar-btn.in .ar-btn__p{animation:none;transform:scale(1);opacity:1;}
  #hud.on{animation:none;}
  .detected #detectRing{animation-duration:.4s;}
  .spark{animation:none;opacity:.7;}
}
</style>
</head>
<body>
  <!-- LAYER 0/1: real-world camera (real mode) OR synthetic backdrop (demo mode) -->
  <div id="demoBg"></div>
  <div id="arContainer"></div>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>

  <!-- LAYER 2: UI overlay -->
  <div id="overlay">
    <!-- Scanning reticle -->
    <div id="scan">
      <div class="reticle" id="reticle">
        <div id="detectRing"></div>
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <div class="scanline"></div>
      </div>
    </div>

    <!-- Status pill + demo banner -->
    <div id="status"><span class="dot searching" id="statusDot"></span><span id="statusText">Searching for card…</span></div>
    <div id="demoBanner">⚠ DEMO MODE · simulated detection — not real tracking</div>

    <!-- Debug toggle + panel -->
    <button id="debugToggle" aria-label="Toggle debug info">🐞</button>
    <div id="debugPanel"></div>

    <!-- Floating buttons injected here -->
    <div id="buttons"></div>

    <!-- Bottom HUD -->
    <div id="hud">
      <div class="idchip">
        <div class="avatar" id="avatar"></div>
        <div class="who"><b id="hudName">Name</b><span id="hudTitle">Title</span></div>
      </div>
      <button id="again" aria-label="Scan again">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 20v-5h5"/></svg>
        Scan again
      </button>
    </div>

    <!-- Start screen — doubles as the "AR intro": auto-advances into the
         camera after a short beat, or on a tap anywhere. This IS the
         continuation of the QR scan, not a separate "please press start"
         landing page — see the README section on the QR/launch flow. -->
    <div id="start">
      <div class="mini-reticle" aria-hidden="true">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <div class="scanline"></div>
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 15c1.5-3 3-3 4.5 0"/><circle cx="15.5" cy="10.5" r="1.6"/></svg>
        </div>
        <div class="intro-sparks"><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span></div>
      </div>
      <div class="eyebrow">AR Visiting Card</div>
      <h1 id="introName">Name</h1>
      <p class="intro-role" id="introRole">Title</p>
      <p class="intro-tagline" id="introTagline">Tagline</p>
      <p class="sub">Point your camera at the card</p>
      <div class="cta-wrap">
        <div class="hint">✨ Tap anywhere to continue</div>
        <button class="btn-textlink" id="demoBtn">No camera? Try demo instead</button>
      </div>
    </div>

    <!-- Toast + fatal error -->
    <div id="toast"></div>
    <div id="fatal">
      <div class="box">
        <h2 id="fatalTitle">Something went wrong</h2>
        <p id="fatalMsg"></p>
        <div class="cta-wrap">
          <button class="btn btn-ghost" id="fatalDemoBtn">Try demo instead</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Real image-target tracking (MindAR) needs ES module "three" resolvable by bare
       specifier. Demo mode also imports THREE the same way, so both paths share one
       version. Bump these two together if you ever upgrade. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
  "use strict";
  /* ============================================================================
     █  CONFIG  █   ← EDIT EVERYTHING HERE. The rest of the app reads from this.
     ============================================================================ */
  import * as THREE from "three";

  /* ============================================================================
     █  DEVICE TIER  █  A one-time, best-effort capability estimate, used
     ONLY to pick starting render QUALITY (pixel ratio cap, particle
     density) — never anything about tracking state. CONFIG.tracking
     (smoothing, grace periods, MindAR tolerances) is completely
     independent of this and behaves identically on every tier; that
     separation is deliberate, not an oversight — a slow device must still
     correctly tell "card found" from "card lost", it should just draw
     fewer particles while doing it. The runtime FPS-based _adaptQuality()
     in Stage is a second, ongoing safety net that can still step quality
     down further than this initial guess if a device underperforms its
     reported specs (thermal throttling, background load, etc.) — the two
     are complementary, not redundant.
     ============================================================================ */
  const DeviceTier = {
    tier:"high", // "high" | "medium" | "low", set once by detect()

    detect(){
      if(REDUCED){ this.tier="low"; return; } // accessibility preference always wins, no guessing needed

      let score=0;
      const cores=navigator.hardwareConcurrency||4;
      score += cores>=6?2:cores>=4?1:0;

      // deviceMemory (GB) is Chrome/Android-only and intentionally coarse
      // (browser rounds it) — absent on Safari/Firefox, so absence is
      // never penalized, only used as a positive/negative nudge when present.
      if(typeof navigator.deviceMemory==="number"){
        score += navigator.deviceMemory>=6?2:navigator.deviceMemory>=4?1:navigator.deviceMemory<2?-2:0;
      }

      const dpr=window.devicePixelRatio||1;
      if(dpr>2.5) score-=1; // very high-density screens cost more GPU work per frame at native res

      const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if(!isMobile) score+=1;

      // WEBGL_debug_renderer_info is best-effort only — modern browsers
      // increasingly return a generic string (privacy fingerprinting
      // mitigation), so this is a small nudge when a real name IS exposed,
      // never something the rest of the score depends on.
      try{
        const c=document.createElement("canvas");
        const gl=c.getContext("webgl")||c.getContext("experimental-webgl");
        const ext=gl&&gl.getExtension("WEBGL_debug_renderer_info");
        const renderer=ext&&gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
        if(renderer && /Mali-4|PowerVR SGX|Adreno \(TM\) [23]0[0-9]/i.test(renderer)) score-=2;
      }catch(e){}

      this.tier = score>=3?"high" : score>=0?"medium" : "low";
      Debug.set("deviceTier",`${this.tier} (score ${score}, cores=${cores}, mem=${navigator.deviceMemory??"?"}, dpr=${dpr})`);

      // CSS-side quality knob: `backdrop-filter` (used all over the glass
      // UI chrome) forces the compositor to re-sample everything behind
      // each blurred element every time that background changes — here,
      // that's a live camera feed AND a WebGL canvas, updating every frame,
      // under a dozen simultaneously-blurred elements (buttons, status
      // pill, HUD chip, debug panel...). That's real, ongoing GPU cost this
      // module never otherwise touches (it only tunes Three.js). Only
      // strip it on low tier, where a flat translucent panel is a better
      // trade than the blur; medium/high keep the full glass look.
      document.documentElement.classList.toggle("perf-low", this.tier==="low");
    },

    pixelRatioCap(){ return this.tier==="high"?2:this.tier==="medium"?1.5:1; },
    particleMultiplier(){ return this.tier==="high"?1:this.tier==="medium"?0.6:0.35; }
  };

  // Tiny tween engine for one-shot animations, advanced from the render loop.
  const _tweens=[];
  function tween(o){const t=Object.assign({e:0,delay:0,dur:1,ease:easeOutCubic},o);_tweens.push(t);return t;}
  function updateTweens(dt){
    for(let i=_tweens.length-1;i>=0;i--){
      const t=_tweens[i];
      if(t.delay>0){t.delay-=dt;if(t.delay>0)continue;}
      t.e+=dt;const p=Math.min(t.e/t.dur,1);
      if(t.onUpdate)t.onUpdate(t.ease(p),p);
      if(p>=1){if(t.onComplete)t.onComplete();_tweens.splice(i,1);}
    }
  }

  /* ============================================================================
     █  SCENE EFFECTS (shared)  █
     Beam / dust / burst / lights builders used by BOTH demo and real mode.
     `scale` controls physical size, `originY` controls where (in local space)
     the card's plane sits — demo mode has its virtual card at y=-1.02; real
     mode's anchor origin (0,0,0) IS the tracked card's center, so originY=0.
     ============================================================================ */
  // pointLight {distance,decay}: demo mode's coordinate space is a handful of
  // units wide, so a physically-falling-off point light (distance:6,decay:2)
  // looks right. Real mode's anchor content is scaled by the tracked image's
  // actual pixel dimensions (MindAR's own convention — hundreds to low
  // thousands of "units"), so a fixed small distance cutoff would make the
  // light invisible; distance:0,decay:0 makes it a constant-intensity fill
  // light instead, which stays visible regardless of that scale factor.
  function buildLights(target, theme, pointLight={distance:6,decay:2}){
    const ambient=new THREE.AmbientLight(0x8fb2ff,0.55);
    const key=new THREE.DirectionalLight(0xffffff,0.9); key.position.set(2,4,3);
    const rim=new THREE.DirectionalLight(new THREE.Color(theme.accent2),0.6); rim.position.set(-3,1,-2);
    const cardLight=new THREE.PointLight(new THREE.Color(theme.accent),0,pointLight.distance,pointLight.decay);
    target.add(ambient,key,rim,cardLight);
    return { cardLight };
  }

  function buildBeam(theme,scale,heightOverride){
    const h=heightOverride??2.6*scale;
    const geo=new THREE.CylinderGeometry(0.06*scale,0.62*scale,h,28,1,true);
    const mat=new THREE.MeshBasicMaterial({color:new THREE.Color(theme.accent),transparent:true,opacity:0,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
    const beam=new THREE.Mesh(geo,mat);
    beam.scale.y=0.001;
    return beam;
  }

  function buildDust(count,scale){
    const n=count,pos=new Float32Array(n*3),spd=new Float32Array(n);
    for(let i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*6*scale;pos[i*3+1]=(Math.random()-.5)*4.4*scale;pos[i*3+2]=(Math.random()-.5)*3.2*scale;spd[i]=(.02+Math.random()*.06)*scale;}
    const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({color:0xbcd6ff,size:.028*Math.max(scale,.6),transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
    const dust=new THREE.Points(geo,mat);dust.userData.spd=spd;dust.userData.span=2.4*scale;
    return dust;
  }

  function buildBurst(count,theme,scale){
    const n=count,pos=new Float32Array(n*3),vel=new Float32Array(n*3);
    const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({color:new THREE.Color(theme.accent),size:.06*Math.max(scale,.6),transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
    const burst=new THREE.Points(geo,mat);burst.userData.vel=vel;burst.userData.n=n;
    return burst;
  }

  // Decorative "holographic data panel" — purely atmospheric (no real
